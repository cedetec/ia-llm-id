services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8090:8000"
    depends_on:
      - mongo
      - ollama
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - OLLAMA_API_URL=http://ollama_service:11434
    volumes:
      - .:/app
      - ./data:/app/data
    networks:
      - asistente_net

  mongo:
    image: mongo:7
    container_name: mongo_db
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - asistente_net

  ollama:
    image: ollama/ollama
    container_name: ollama_service
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - asistente_net

networks:
  asistente_net:
    driver: bridge
